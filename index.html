<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#17143b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sentinel Arcade">
  <meta name="description" content="An installable learning arcade for states, spelling, multiplication, poems, missions, and progress reports.">
  <title>Circuit Sentinel's Learning Arcade</title>
  <link rel="manifest" href="manifest.webmanifest?v=20">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/app-icon-192.png?v=20">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/app-icon-180.png?v=20">
  <link rel="stylesheet" href="styles.css?v=23">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" data-go="home" aria-label="Go home">
        <img class="brand-icon" src="assets/icons/app-icon-192.png" alt=""><span><small>CIRCUIT SENTINEL'S</small>Learning Arcade</span>
      </button>
      <div class="top-actions">
        <button class="profile-button" type="button" data-go="profiles" aria-label="Choose profile"><span class="profile-avatar" id="profileInitial">P</span><span class="profile-meta"><small>ACTIVE PILOT</small><strong id="profileName">Player 1</strong></span><span class="hud-chevron" aria-hidden="true">›</span></button>
        <div class="sound-controls" aria-label="Sound controls"><label class="sound-toggle" title="Sound on or off"><input type="checkbox" id="soundEnabled" aria-label="Turn game sound on or off" checked><span aria-hidden="true">♫</span></label><label class="sound-slider"><small>AUDIO</small><input type="range" id="soundVolume" min="0" max="100" value="45" aria-label="Game sound volume"></label></div>
        <button class="icon-button" type="button" data-go="settings" aria-label="Open parent setup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M7 14v6"/></svg></button>
      </div>
    </header>

    <main id="app" tabindex="-1">
      <section class="screen active" data-screen="home">
        <div class="welcome-row">
          <div>
            <p class="eyebrow">Choose a quest</p>
            <h1>What should we practice?</h1>
          </div>
          <div class="streak-chip"><img src="assets/ui/energy-orb.png" alt=""><strong id="totalStars">0</strong> orbs</div>
        </div>
        <section class="home-cast" aria-label="Your learning guides">
          <img class="home-professor" src="assets/characters/professor-volt.png" alt="Professor Volt">
          <div class="cast-copy"><p class="eyebrow">Mission control</p><h2>Professor Volt and Circuit Sentinel are ready!</h2></div>
          <img class="home-robot" src="assets/characters/skins/core-idle.png" alt="Core Sentinel Circuit Sentinel">
        </section>
        <div class="subject-grid">
          <button class="subject-card states" data-go="states">
            <span class="subject-icon">⌖</span><span class="subject-copy"><strong>State Quest</strong><small>States · capitals · abbreviations · maps</small></span><span class="arrow">›</span>
          </button>
          <button class="subject-card spelling" data-go="spelling">
            <span class="subject-icon">Aa</span><span class="subject-copy"><strong>Word Wizard</strong><small>This week's spelling words</small></span><span class="arrow">›</span>
          </button>
          <button class="subject-card math" data-go="math">
            <span class="subject-icon">×</span><span class="subject-copy"><strong>Multiply Mayhem</strong><small>Facts from 0 × 0 through 9 × 9</small></span><span class="arrow">›</span>
          </button>
          <button class="subject-card poems" data-go="poems">
            <span class="subject-icon">❝</span><span class="subject-copy"><strong>Poem Power</strong><small>Read · remember · recite</small></span><span class="arrow">›</span>
          </button>
        </div>
        <div class="adventure-grid"><button class="adventure-card mission-link" data-go="story"><span>MISSION MAP</span><strong>Story Mode</strong><small>Animated chapters and restoration goals</small></button><button class="adventure-card armory-link" data-go="armory"><span>ORBS & FORMS</span><strong>Shop & Locker</strong><small>Unlock and equip Sentinel forms</small></button><button class="adventure-card report-link" data-go="reports"><span>LEARNING RECORD</span><strong>Assessments & Reports</strong><small>Accuracy, subjects, and recent rounds</small></button></div>
        <section class="progress-panel" id="homeReport"></section>
      </section>

      <section class="screen" data-screen="states"><div id="statesView"></div></section>
      <section class="screen" data-screen="spelling"><div id="spellingView"></div></section>
      <section class="screen" data-screen="math"><div id="mathView"></div></section>
      <section class="screen" data-screen="poems"><div id="poemsView"></div></section>
      <section class="screen" data-screen="story"><div id="storyView"></div></section>
      <section class="screen" data-screen="chapter"><div id="chapterView"></div></section>
      <section class="screen" data-screen="armory"><div id="armoryView"></div></section>
      <section class="screen" data-screen="profiles"><div id="profilesView"></div></section>
      <section class="screen" data-screen="reports"><div id="reportsView"></div></section>
      <section class="screen" data-screen="session"><div id="sessionView"></div></section>
      <section class="screen" data-screen="settings"><div id="settingsView"></div></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="data.js?v=20"></script>
  <script src="app.js?v=23"></script>
</body>
</html>
